# Manifold2D CI -- the shared Starworks tri-platform standard (see docs/ci.md).
# One matrix: OS x compiler x config. Every leg runs the SAME entry points:
#   build:  scripts/build.{ps1,sh} <Config>
#   test:   scripts/run-tests.{ps1,sh} <Config> --rng-seed <N>
#           (fixed seeds 1 and 24301, plus one seed derived from the run number)
# A determinism job diffs the cross-platform dumps of all legs; sanitizer lanes
# run the suite under ASan+UBSan and TSan (Linux Clang 19 Debug).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  XCODE_VERSION: "16.4"   # macOS toolchain pin (xcode-select)
  SEED_A: "1"             # fixed seeds: reproducible, documented in docs/ci.md
  SEED_B: "24301"


jobs:
  build-test:
    name: ${{ matrix.leg }}-${{ matrix.config }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]
        leg: [windows-msvc, linux-gcc14, linux-clang19, macos-appleclang]
        include:
          - leg: windows-msvc
            os: windows-2025
            shell: pwsh
            ext: ps1
          - leg: linux-gcc14
            os: ubuntu-24.04
            shell: bash
            ext: sh
            cc: gcc-14
            cxx: g++-14
          - leg: linux-clang19
            os: ubuntu-24.04
            shell: bash
            ext: sh
            cc: clang-19
            cxx: clang++-19
          - leg: macos-appleclang
            os: macos-15
            shell: bash
            ext: sh
            cc: clang
            cxx: clang++
    defaults:
      run:
        shell: ${{ matrix.shell }}
    env:
      CC: ${{ matrix.cc }}
      CXX: ${{ matrix.cxx }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Clang 19
        if: matrix.leg == 'linux-clang19'
        run: |
          if ! command -v clang++-19 >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends clang-19
          fi

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        if: runner.os == 'macOS'
        run: |
          sudo xcode-select -s "/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          xcodebuild -version

      # The third seed moves with the run number (printed, and in every result
      # file name, so a failure reproduces with --rng-seed N): new rapidcheck
      # cases and test orders keep being explored. The fixed seeds stay the
      # reproducible baseline.
      - name: Run-number seed
        shell: bash
        run: echo "SEED_RUN=$(( ${{ github.run_number }} % 98999 + 1000 ))" >> "$GITHUB_ENV"

      - name: Build ${{ matrix.config }}
        id: build
        run: scripts/build.${{ matrix.ext }} ${{ matrix.config }}

      - name: Test ${{ matrix.config }} (seed ${{ env.SEED_A }})
        run: scripts/run-tests.${{ matrix.ext }} ${{ matrix.config }} --rng-seed ${{ env.SEED_A }}

      - name: Test ${{ matrix.config }} (seed ${{ env.SEED_B }})
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/run-tests.${{ matrix.ext }} ${{ matrix.config }} --rng-seed ${{ env.SEED_B }}

      - name: Test ${{ matrix.config }} (seed ${{ env.SEED_RUN }}, run number)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/run-tests.${{ matrix.ext }} ${{ matrix.config }} --rng-seed ${{ env.SEED_RUN }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.leg }}-${{ matrix.config }}
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  determinism:
    name: cross-platform-determinism
    needs: build-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: legs

      - name: Compare determinism dumps across all legs
        run: python3 scripts/compare-determinism.py legs --expect 8

  # The suite under sanitizers: ASan+UBSan, and TSan for the std::thread-pool
  # tests (broadphase/solver MT invariance, contact events). Linux Clang 19
  # Debug through the same entry points (premake --sanitize). Only JUnit is
  # uploaded -- no determinism dumps, so cross-platform-determinism ignores
  # these lanes.
  sanitize:
    name: sanitize-${{ matrix.lane.name }}-Debug
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        lane:
          - name: asan-ubsan
            premake: --sanitize=address
          - name: tsan
            premake: --sanitize=thread
    env:
      CC: clang-19
      CXX: clang++-19
      ASAN_OPTIONS: halt_on_error=1:detect_leaks=1:abort_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1:abort_on_error=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 libclang-rt-19-dev libstdc++-14-dev
          clang++-19 --version

      - name: Build Debug (${{ matrix.lane.premake }})
        id: build
        run: scripts/build.sh Debug ${{ matrix.lane.premake }}

      - name: Test (seed ${{ env.SEED_A }})
        run: scripts/run-tests.sh Debug --rng-seed ${{ env.SEED_A }}

      - name: Test (seed ${{ env.SEED_B }})
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: scripts/run-tests.sh Debug --rng-seed ${{ env.SEED_B }}

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sanitize-${{ matrix.lane.name }}-Debug
          path: test-results/junit-*.xml
          if-no-files-found: error
          retention-days: 14

  # Discord: post this repo's CI result into its thread in the ⚙️・ci-builds forum (shared action:
  # StarworksDev/.github/actions/discord-ci-notify). Never for pull requests (fork PRs get no secrets).
  notify:
    name: Discord notify
    needs: [build-test, determinism, sanitize]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    steps:
      - uses: StarworksDev/.github/actions/discord-ci-notify@main
        with:
          result: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || 'success') }}
          webhook: ${{ secrets.DISCORD_CI_WEBHOOK }}
          threads: ${{ vars.DISCORD_CI_THREADS }}
          github-token: ${{ github.token }}
